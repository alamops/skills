# AGENTS_CONFIG.yml — per-phase model routing for /implement
#
# Copy this to your repo root as AGENTS_CONFIG.yml, or let `/implement`
# generate it for you on first run. Re-run `/implement --config` to change it.
#
# Two ideas carry the whole file:
#
#   1. A logical model is a ROLE, not a model ID. You name `reviewer` once and
#      phases refer to it. What it resolves to depends on the harness you're in.
#   2. A runner `type` says WHICH agent, not how to reach it. `type: codex`
#      means "the Codex CLI" — /implement already knows the command shape.
#
# That's what lets one file mean "review with Opus when I'm driving from Claude
# Code, review with GPT-5.6 Sol when I'm driving from Codex" — without writing
# out all seven phases twice.
#
# See references/agents-config.md for the full schema.

version: 3

# Which harness /implement is running IN (not which model it calls).
# `auto` detects it — primarily by checking whether a native sub-agent tool
# exists. Pin it if detection ever guesses wrong.
#   claude_code | codex | cursor | gemini | kimi | grok
host: auto

defaults:
  strategy: distribute                # distribute | race, when a phase names >1 role
  allow_orchestrator_override: true   # let the orchestrator race a risky task in a distribute phase
  fallback: builder                   # a role from models: — used when a binding won't resolve


# ── Roles ──────────────────────────────────────────────────────────────────
# Name a role once, then bind it per host. Host keys: claude_code | codex |
# any (matches every host you didn't name explicitly).
#
# Runner types — each external one takes just a `model:`; /implement builds the
# command and derives the permission level from the phase (read-only for
# investigate/code_review, auto-approve for the writing phases).
#
#   self   — the orchestrator does it inline in this session. Only for `planning`.
#   claude — a Claude model. Native Agent tool when hosted by Claude Code;
#            otherwise /implement shells out to `claude -p`. Portable either way.
#            model: opus | sonnet | haiku | fable
#   codex  — Codex CLI.       gpt-5.6-sol | gpt-5.6-terra | gpt-5.6-pro | gpt-5.4-mini
#   cursor — Cursor Agent.    composer-2.5 | gpt-5.6-sol-high | claude-opus-5-thinking-high
#                             (run `cursor-agent --list-models` for the live set)
#   gemini — Gemini CLI.      gemini-2.5-pro | gemini-2.5-flash
#   kimi   — Kimi Code CLI.   kimi-code/kimi-for-coding
#   grok   — Grok Build CLI.  grok-4.5 | grok-build-0.1
#   shell  — escape hatch for a CLI with no built-in recipe; needs `command:`.
#
# HEADS UP on grok: it has no headless read-only mode (its plan mode is TUI
# only), so a grok binding on investigate/code_review is constrained by its
# brief rather than by a flag. Every other type enforces read-only properly.
#
# See references/harnesses.md for the exact command each type runs and a
# capability matrix (read-only support, working-dir flags, prompt delivery).

models:

  # Phase 3 stays with the orchestrator — it has the full conversation.
  orchestrator:
    any: { type: self }

  # Note the pattern below: the Claude binding sits under `any:`, not under
  # `claude_code:`. A `type: claude` binding is PORTABLE — native Agent tool
  # when Claude Code is hosting, `claude -p` when anything else is. Parking it
  # on `any:` means a harness you never named (Cursor, Gemini CLI, CI) still
  # gets the model you chose, instead of falling through to a generic default.
  # `codex:` then overrides it on that one host.

  # Read-only investigation. `subagent_type: Explore` has no edit tools, so on
  # Claude Code a research agent structurally cannot modify code; elsewhere the
  # key is simply unused and the sandbox flag does that job.
  scout:
    any:   { type: claude, model: sonnet, subagent_type: Explore }
    codex: { type: codex,  model: gpt-5.6-terra }

  # Writes production code and tests. On Cursor, `-w/--worktree` gives this
  # runner an isolated checkout for free — worth reaching for when a writing
  # wave puts it alongside another runner.
  builder:
    any:    { type: claude, model: sonnet }
    codex:  { type: codex,  model: gpt-5.6-terra }
    cursor: { type: cursor, model: composer-2.5 }
    kimi:   { type: kimi,   model: kimi-code/kimi-for-coding }
    grok:   { type: grok,   model: grok-4.5 }

  # Reviews the diff. Worth the strongest model you're willing to pay for —
  # this is where correctness compounds. Bind only the harnesses you actually
  # drive /implement from; `any:` covers every one you don't name.
  #   Claude Code (or any unnamed harness) -> opus
  #   Codex                                -> gpt-5.6-sol
  #   Cursor                               -> Opus 5 thinking
  #   Gemini CLI                           -> gemini-2.5-pro
  #
  # Note there is deliberately NO `grok:` binding here. Grok has no headless
  # read-only mode, so it can't be structurally prevented from editing while
  # it reviews. With no binding, a Grok-hosted session falls through to `any:`
  # and reviews with Opus over `claude -p` instead. Add `grok:` here only if
  # you accept a reviewer whose read-only-ness is a promise, not a guarantee.
  reviewer:
    any:    { type: claude, model: opus }
    codex:  { type: codex,  model: gpt-5.6-sol }
    cursor: { type: cursor, model: claude-opus-5-thinking-high }
    gemini: { type: gemini, model: gemini-2.5-pro }

  # Runs the suites and reports. Owns the full e2e lifecycle when e2e is in
  # scope (start app, seed, run headless, tear down) — that's real work, so
  # don't drop below a mid-tier model in an e2e-heavy repo.
  test_runner:
    any:   { type: claude, model: haiku }
    codex: { type: codex,  model: gpt-5.4-mini }

  # Example escape hatch, for a CLI /implement has no built-in recipe for.
  # Uncomment and adjust if you use one. `stdin:` matters — naming a file in
  # argv does not make a CLI read it; most treat the path as the prompt.
  # second_opinion:
  #   any:
  #     type: shell
  #     model: gemini-2.5-pro
  #     command: "gemini -m gemini-2.5-pro -p {PROMPT}"
  #     unavailable_fallback: reviewer


# ── Phases ─────────────────────────────────────────────────────────────────
# `use:` takes one role, or a list of them (which activates `strategy`).

phases:

  # 1 — parallel research of codebase, git history, and web best practices (read-only)
  investigate:
    use: scout

  # 3 — the orchestrator writes the plan inline and saves it to docs/plans/
  planning:
    use: orchestrator

  # 4 — parallel agents on independent, file-disjoint implementation tasks
  implementation:
    use: builder
    strategy: distribute

  # 5 — review the diff using the code-review skill as the rubric.
  #     Read-only, so this is the one phase where running BOTH harnesses is
  #     safe and clearly worth it. Uncomment cross_host to get Opus AND Sol
  #     on every review, with their distinct findings merged.
  code_review:
    use: reviewer
    # strategy: race
    # cross_host: true

  # 6 — parallel agents authoring tests (unit / integration / e2e when applicable),
  #     partitioned by module under test
  tests_creation:
    use: builder
    strategy: distribute

  # 7 — a single background agent runs the suites and reports results
  tests_running:
    use: test_runner

  # 8 — (conditional) parallel agents fixing failures / must-fix review findings
  tests_fixes:
    use: builder
    strategy: distribute
